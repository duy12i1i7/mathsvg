schema_version = 1
profile = "fast"
status = "development"
dsl_version = 1
container_version = 1

[blocks]
superblock_bytes = 1048576
block_bytes = 1048576
microblock_bytes = 4096

[limits]
encoder_rss_bytes = 268435455
decoder_rss_bytes = 268435455
max_nodes_per_block = 65536
max_graph_depth = 16
max_dependency_depth = 8
max_candidate_descriptors = 256
max_decode_work_per_output_byte = 64

[search]
coordinate_catalog = ["identity", "stride", "byte_plane", "bit_plane"]
function_catalog = ["literal", "entropy_literal", "const", "linear", "periodic", "recurrence", "exceptions"]
whole_block_entropy = true
whole_block_functions = true
interval_functions = true
coordinate_depth = 1
residual_depth = 0
symbolic_depth = 0
dag_sharing = false
exact_microblock = false
candidate_budget = 256
work_budget = 24000000
minimum_serialized_gain_bytes = 1

[parallel]
default_threads = 1
deterministic_merge = true

[entropy]
baseline_policy = "G1"
add_only_policy = "none"
chain_depth = 1
one_byte_lazy = false
parser_scratch_bytes = 262144
maximum_additional_work_per_input_byte_per_walk = 0
maximum_policy_walks = 0

[stop]
minimum_oracle_gain_fraction = 0.005
maximum_search_multiplier_below_threshold = 2.0
